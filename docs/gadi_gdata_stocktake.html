<script>
(function () {
  const D = JSON.parse(document.getElementById("data").textContent);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const P = D.sources.map(s => s.label);
  // Eight fixed categorical slots, assigned in source order so a colour always
  // means the same source. Past eight, sources share a neutral grey rather
  // than generating hues that could not be told apart.
  const COL = Object.fromEntries(P.map((p, i) => [p, i < 8 ? `var(--s${i + 1})` : "var(--other)"]));
  const DAYS = D.purge_days;
  const OLD = `${DAYS}+ days`;
  const $ = id => document.getElementById(id);

  const owners = D.owners.map(o => {
    const bytes = P.reduce((s, p) => s + (o.b[p] || 0), 0);
    const inodes = P.reduce((s, p) => s + (o.i[p] || 0), 0);
    return { ...o, bytes, inodes, recent: bytes - o.stale, avg: o.files ? bytes / o.files : 0 };
  });

  const human = n => {
    const u = ["B", "KB", "MB", "GB", "TB", "PB", "EB"];
    let i = 0;
    while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
    return `${n.toFixed(1)} ${u[i]}`;
  };
  const tickBytes = n => {
    if (n === 0) return "0";
    const u = ["B", "KB", "MB", "GB", "TB", "PB", "EB"];
    let i = 0;
    while (n >= 1000 && i < u.length - 1) { n /= 1000; i++; }
    return `${+n.toFixed(1)} ${u[i]}`;
  };
  const compact = n => n >= 1e6 ? `${+(n / 1e6).toFixed(2)}M` : n >= 1e3 ? `${+(n / 1e3).toFixed(n >= 1e5 ? 0 : 1)}k` : `${n}`;
  const comma = n => n.toLocaleString();
  const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;

  // Header
  $("eyebrow").textContent = [D.common_parent, P.join(" "), `scanned ${D.scanned} with rudu ${D.rudu_version}`]
    .filter(Boolean).join(" · ");
  $("lede").textContent = `Who owns the data across ${plural(P.length, "source", "sources")}, how much of it has gone untouched for ${DAYS} days or more, and who is using up the inodes.`;
  $("leg-recent").textContent = `Accessed in the last ${DAYS} days`;
  $("leg-stale").textContent = `Not accessed for ${OLD}`;
  const partial = D.sources.filter(s => s.partial).map(s => s.label);
  if (partial.length) {
    $("partial").hidden = false;
    $("partial").textContent = `The scan of ${partial.join(", ")} stopped early at the memory limit, so its numbers are a lower bound.`;
  }

  // Flags that put state into form
  const mostlyOld = o => o.bytes >= 1e11 && o.stale / o.bytes >= 0.9;
  const smallFiles = o => o.inodes >= 50000 && o.files && o.avg < 5e6;

  // Summary tiles
  const totB = owners.reduce((s, o) => s + o.bytes, 0);
  const totS = owners.reduce((s, o) => s + o.stale, 0);
  const totI = owners.reduce((s, o) => s + o.inodes, 0);
  const tiles = [
    ["Total stored", human(totB), `across ${plural(P.length, "source", "sources")}`],
    [`Not accessed for ${OLD}`, human(totS), `${pct(totS, totB)}% of all data`],
    ["Inodes", compact(totI), `${comma(totI)} files and directories`],
    ["Owners", `${owners.filter(o => o.bytes || o.inodes > 10).length}`, `${owners.length} including directory-only owners`],
  ];
  $("tiles").innerHTML = tiles.map(([l, v, s]) =>
    `<div class="tile"><span class="label">${esc(l)}</span><span class="value">${esc(v)}</span><span class="sub">${esc(s)}</span></div>`).join("");

  // Source strip
  const pMax = Math.max(...D.sources.map(x => x.bytes), 1);
  $("projects").innerHTML = [...D.sources].sort((a, b) => b.bytes - a.bytes).map(x => {
    const w = 100 * x.bytes / pMax, sw = x.bytes ? w * x.stale / x.bytes : 0;
    return `<div class="prow" title="${esc(x.path)}">
      <span class="pname"><i class="sw" style="background:${COL[x.label]}"></i>${esc(x.label)}</span>
      <div class="track" style="height:20px">
        <div class="bar" style="top:2px;width:100%">
          <div class="segm" style="left:0;width:max(1px, calc(${w - sw}% - 2px));background:var(--recent)"></div>
          <div class="segm end" style="left:${w - sw}%;width:${sw}%;background:var(--stale)"></div>
        </div>
      </div>
      <span class="pnum"><b>${human(x.bytes)}</b> · ${pct(x.stale, x.bytes)}% old<br>${compact(x.inodes)} inodes</span>
    </div>`;
  }).join("");

  // Owner chart state
  const state = { measure: "storage", colour: "project", all: false, q: "", sortKey: null, sortDir: -1 };
  const TOP = 25;

  const segmentsFor = o => {
    if (state.measure === "inodes") return P.filter(p => o.i[p]).map(p => ({ k: p, v: o.i[p], c: COL[p] }));
    if (state.colour === "age") return [
      { k: `Accessed in last ${DAYS} days`, v: o.recent, c: "var(--recent)" },
      { k: `Not accessed for ${OLD}`, v: o.stale, c: "var(--stale)" },
    ].filter(s => s.v > 0);
    return P.filter(p => o.b[p]).map(p => ({ k: p, v: o.b[p], c: COL[p] }));
  };
  const total = o => state.measure === "inodes" ? o.inodes : o.bytes;

  const niceStep = raw => {
    const e = Math.pow(10, Math.floor(Math.log10(raw)));
    const f = raw / e;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
  };

  function render() {
    const q = state.q.trim().toLowerCase();
    const sorted = owners.filter(o => total(o) > 0).sort((a, b) => total(b) - total(a));
    const matched = q ? sorted.filter(o => o.o.toLowerCase().includes(q)) : sorted;
    const shown = q || state.all ? matched : matched.slice(0, TOP);

    // Legend
    const leg = state.measure === "storage" && state.colour === "age"
      ? [[`Accessed in last ${DAYS} days`, "var(--recent)"], [`Not accessed for ${OLD}`, "var(--stale)"]]
      : P.map(p => [p, COL[p]]);
    $("legend").innerHTML = leg.map(([k, c]) => `<span><i class="sw" style="background:${c}"></i><span class="${P.includes(k) ? "mono" : ""}">${esc(k)}</span></span>`).join("")
      + (state.measure === "storage"
        ? `<span><i class="chip old">Mostly old</i>90%+ untouched for ${DAYS} days</span>`
        : `<span><i class="chip small">Small files</i>average file under 5 MB</span>`);

    // Scale (shared max of everyone, so the axis does not jump while searching)
    const max = Math.max(...sorted.map(total), 1);
    const step = niceStep(max / 4);
    const top = Math.ceil(max / step) * step;
    const ticks = [];
    for (let v = 0; v <= top + step / 2; v += step) ticks.push(v);
    const fmtTick = state.measure === "inodes" ? compact : tickBytes;
    const gl = ticks.map((v, i) => `<i class="gridline${i === 0 ? " base" : ""}" style="left:${100 * v / top}%"></i>`).join("");

    let html = `<div class="axis"><span></span><div class="ticks">${ticks.map(v => `<span class="tick" style="left:${100 * v / top}%">${fmtTick(v)}</span>`).join("")}</div><span></span></div>`;
    if (!shown.length) html += `<div class="empty">No owner matches “${esc(state.q)}”.</div>`;
    shown.forEach((o, idx) => {
      const segs = segmentsFor(o);
      let cum = 0;
      const bars = segs.map((s, i) => {
        const w = 100 * s.v / top, left = cum;
        cum += w;
        const last = i === segs.length - 1;
        const width = last ? `max(1px, ${w}%)` : `max(1px, calc(${w}% - 2px))`;
        return `<i class="segm${last ? " end" : ""}" style="left:${left}%;width:${width};background:${s.c}"></i>`;
      }).join("");
      let val, chip = "";
      if (state.measure === "inodes") {
        val = compact(o.inodes);
        if (smallFiles(o)) chip = `<i class="chip small">Small files</i>`;
      } else {
        val = human(o.bytes);
        if (mostlyOld(o)) chip = `<i class="chip old">Mostly old</i>`;
      }
      html += `<div class="row" data-i="${owners.indexOf(o)}" tabindex="0">
        <span class="owner" title="${esc(o.o)}">${esc(o.o)}</span>
        <div class="track">${gl}<div class="bar" style="left:0;right:0">${bars}</div></div>
        <span class="val">${chip}<span>${val}</span></span>
      </div>`;
    });
    $("chart").innerHTML = html;
    $("chart").setAttribute("aria-label", `${state.measure === "inodes" ? "Inodes" : "Storage"} by owner, ${shown.length} owners shown`);

    const btn = $("more");
    btn.hidden = !!q || matched.length <= TOP;
    btn.textContent = state.all ? `Show top ${TOP} only` : `Show all ${matched.length} owners`;

    $("note").textContent = state.measure === "inodes"
      ? "Inodes count files and directories. Owners with many small files can usually free inodes by bundling them into tar archives."
      : state.colour === "age"
        ? `Not accessed means no file read for ${DAYS} days or more, based on each file's last access time. Files carrying a 1970 access time (common after archive extraction) count as old.`
        : "Each bar is split by source. Hover or focus a row for the breakdown.";

    $("colour-ctl").hidden = state.measure === "inodes";
    renderTable();
  }

  // Tooltip
  const tip = $("tip");
  function showTip(row, x, y) {
    const o = owners[+row.dataset.i];
    if (!o) return;
    document.querySelectorAll(".row.active").forEach(r => r.classList.remove("active"));
    row.classList.add("active");
    const segs = segmentsFor(o);
    const fmt = state.measure === "inodes" ? comma : human;
    const tot = total(o);
    const foot = state.measure === "inodes"
      ? `${comma(o.files)} files · ${comma(o.dirs)} directories${o.files ? ` · average file ${human(o.avg)}` : ""}`
      : `${human(o.stale)} (${pct(o.stale, o.bytes)}%) not accessed for ${OLD} · ${comma(o.files)} files`;
    tip.innerHTML = `<div class="t-h">${esc(o.o)}</div>`
      + segs.map(s => `<div class="t-r"><i class="sw" style="background:${s.c}"></i><span class="${P.includes(s.k) ? "mono" : ""}">${esc(s.k)}</span><span>${fmt(s.v)} · ${pct(s.v, tot)}%</span></div>`).join("")
      + `<div class="t-r"><i></i><b>Total</b><b>${fmt(tot)}</b></div>`
      + `<div class="t-f">${foot}</div>`;
    tip.hidden = false;
    const r = tip.getBoundingClientRect();
    let left = x + 14, topY = y + 14;
    if (left + r.width > innerWidth - 8) left = Math.max(8, x - r.width - 14);
    if (topY + r.height > innerHeight - 8) topY = Math.max(8, y - r.height - 14);
    tip.style.left = `${left}px`;
    tip.style.top = `${topY}px`;
  }
  function hideTip() {
    tip.hidden = true;
    document.querySelectorAll(".row.active").forEach(r => r.classList.remove("active"));
  }
  $("chart").addEventListener("pointermove", e => {
    const row = e.target.closest(".row");
    row ? showTip(row, e.clientX, e.clientY) : hideTip();
  });
  $("chart").addEventListener("pointerleave", hideTip);
  $("chart").addEventListener("focusin", e => {
    const row = e.target.closest(".row");
    if (row) { const b = row.getBoundingClientRect(); showTip(row, b.left + b.width * 0.4, b.bottom); }
  });
  $("chart").addEventListener("focusout", hideTip);

  // Table
  function renderTable() {
    const inodes = state.measure === "inodes";
    const cols = inodes
      ? [["o", "Owner"], ["inodes", "Inodes"], ["files", "Files"], ["dirs", "Directories"], ["avg", "Avg file"], ...P.map(p => [`i:${p}`, p])]
      : [["o", "Owner"], ["bytes", "Total"], ["stale", `${OLD} old`], ["stalePct", "% old"], ...P.map(p => [`b:${p}`, p])];
    const get = (o, k) => k === "stalePct" ? (o.bytes ? o.stale / o.bytes : 0)
      : k.startsWith("i:") ? (o.i[k.slice(2)] || 0) : k.startsWith("b:") ? (o.b[k.slice(2)] || 0) : o[k];
    const key = state.sortKey && cols.some(c => c[0] === state.sortKey) ? state.sortKey : (inodes ? "inodes" : "bytes");
    const q = state.q.trim().toLowerCase();
    const rows = owners.filter(o => (inodes ? o.inodes : o.bytes) > 0 && (!q || o.o.toLowerCase().includes(q)))
      .sort((a, b) => {
        const x = get(a, key), y = get(b, key);
        return (typeof x === "string" ? x.localeCompare(y) : x - y) * state.sortDir;
      });
    const cell = (o, k) => {
      const v = get(o, k);
      if (k === "o") return esc(v);
      if (k === "stalePct") return `${pct(o.stale, o.bytes)}%`;
      if (!v) return "";
      if (k === "avg") return human(v);
      if (inodes) return comma(v);
      return human(v);
    };
    $("table").innerHTML = `<thead><tr>${cols.map(([k, l]) =>
      `<th scope="col"><button type="button" data-k="${esc(k)}" ${k === key ? `aria-sort="${state.sortDir < 0 ? "descending" : "ascending"}"` : ""} class="${P.includes(l) ? "mono" : ""}">${esc(l)}</button></th>`).join("")}</tr></thead>
      <tbody>${rows.map(o => `<tr>${cols.map(([k]) => `<td>${cell(o, k)}</td>`).join("")}</tr>`).join("")}</tbody>`;
    $("tbl-summary").textContent = `Full table · ${inodes ? "inodes" : "storage"} · ${rows.length} owners`;
  }
  $("table").addEventListener("click", e => {
    const b = e.target.closest("button[data-k]");
    if (!b) return;
    const k = b.dataset.k;
    if (state.sortKey === k) state.sortDir *= -1;
    else { state.sortKey = k; state.sortDir = k === "o" ? 1 : -1; }
    renderTable();
  });

  // Controls
  const setPressed = (on, off) => { $(on).setAttribute("aria-pressed", "true"); $(off).setAttribute("aria-pressed", "false"); };
  $("m-storage").onclick = () => { state.measure = "storage"; state.sortKey = null; state.sortDir = -1; setPressed("m-storage", "m-inodes"); render(); };
  $("m-inodes").onclick = () => { state.measure = "inodes"; state.sortKey = null; state.sortDir = -1; setPressed("m-inodes", "m-storage"); render(); };
  $("c-project").onclick = () => { state.colour = "project"; setPressed("c-project", "c-age"); render(); };
  $("c-age").onclick = () => { state.colour = "age"; setPressed("c-age", "c-project"); render(); };
  $("more").onclick = () => { state.all = !state.all; render(); };
  $("search").addEventListener("input", e => { state.q = e.target.value; render(); });

  // Footer
  $("footer").innerHTML = [
    "Sizes are disk usage in decimal units (1 TB = 10¹² bytes), summed over each file's owner. Inodes are files plus directories, each counted for its own owner.",
    `“Not accessed” uses each file's last access time against a ${DAYS}-day threshold (<code>--purge-days</code>). Results restored from rudu's cache can over-state age, never under-state it; use <code>--no-cache</code> for exact values.`,
    "Hard-linked files count once, as in <code>du</code>. Directories' own blocks are not attributed to an owner.",
    `Sources: ${D.sources.map(s => `<code>${esc(s.label)}</code> = <code>${esc(s.path)}</code>`).join(", ")}.`,
    `Generated by <code>${esc(D.command)}</code>`,
  ].map(t => `<div>${t}</div>`).join("");

  render();
})();
</script>
</body>
</html>
